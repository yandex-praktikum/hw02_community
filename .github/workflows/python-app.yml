name: Python application

on:
  push:
    branches: [ CI ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python 3.8
      uses: actions/setup-python@v2
      with:
        python-version: 3.8
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Git Clone Action
      uses: actions/checkout@v2
      with:
        repository: ${{ secrets.repository }}
        ssh-key: ${{ secrets.ACCESS_TOKEN }}
        path: yatube/
    - name: Test with pytest
#       env:
#         PATHONPATH: yatube/
#         SECRET_KEY: "5UP3R-53CR3T-K3Y-FR0M-TurboKach"
#         DJANGO_SETTINGS_MODULE: yatube
      run: |
        export DJANGO_SETTINGS_MODULE="${DJANGO_SETTINGS_MODULE:="yatube.settings"}"
        export SECRET_KEY="${SECRET_KEY:="5UP3R-53CR3T-K3Y-FR0M-TurboKach"}"
        export DEBUG="${DEBUG:="1"}"
        export ALLOWED_HOSTS="${ALLOWED_HOSTS:="*"}"
        python yatube/yatube/manage.py migrate
        py.test --ds yatube.yatube.settings
